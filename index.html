*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; font-family:Inter,system-ui,sans-serif; color:var(--cream);
  background-color:var(--charcoal);
  background-image:radial-gradient(ellipse at 8% 4%,rgba(198,107,67,.22),transparent 40%),linear-gradient(180deg,rgba(16,13,11,.84) 0%,rgba(28,18,14,.8) 45%,rgba(16,13,11,.94) 100%),var(--bg-img);
  background-size:cover; background-position:center; background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:410px;min-height:100vh;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;animation:fade .9s ease both}
.logo{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(185,130,77,.6);
  background:radial-gradient(circle at 30% 25%,var(--coffee),var(--charcoal));box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(242,231,216,.08)}
h1{font-family:Manrope,sans-serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:.34em;padding-left:.34em;margin-top:12px}
.tagline{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px;color:var(--caramel);margin-top:16px}
.loc{font-size:13px;color:var(--muted);margin-top:4px}
.card{width:100%;border-radius:24px;border:1px solid rgba(185,130,77,.4);padding:24px 20px 20px;
  background:linear-gradient(160deg,rgba(56,37,27,.85),rgba(28,18,14,.93) 55%,rgba(16,13,11,.95));
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(242,231,216,.07);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .8s .15s cubic-bezier(.2,.7,.2,1) both}
.intro{text-align:center;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--caramel)}
h2{font-family:Manrope,sans-serif;font-weight:700;font-size:22px;line-height:1.3;max-width:17rem;margin:8px auto 0}
.intro p{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:19rem;margin:8px auto 0}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 14px;border-radius:16px;text-decoration:none;color:inherit;
  background:rgba(16,13,11,.55);border:1px solid rgba(185,130,77,.28);opacity:0;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;transition:transform .2s,background .2s,border-color .2s}
.btn:nth-child(1){animation-delay:.35s}.btn:nth-child(2){animation-delay:.43s}.btn:nth-child(3){animation-delay:.51s}
.btn:nth-child(4){animation-delay:.59s}.btn:nth-child(5){animation-delay:.67s}
.btn.off{cursor:default}
.btn.off:hover{transform:none;background:rgba(16,13,11,.55);border-color:rgba(185,130,77,.28)}
.btn.off.primary:hover{background:rgba(198,107,67,.12);border-color:var(--terracotta)}
.btn:hover{transform:translateY(-2px);background:rgba(56,37,27,.85);border-color:rgba(185,130,77,.6)}
.btn:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(16,13,11,.85);border:1px solid rgba(185,130,77,.25);color:var(--caramel)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.t{display:block;font-family:Manrope,sans-serif;font-weight:700;font-size:15px;line-height:1.2}
.s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:18px;height:18px;flex:none;stroke:var(--caramel);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7;transition:.2s}
.btn:hover .chev{transform:translateX(2px);opacity:1}
.btn.primary{background:rgba(198,107,67,.12);border-color:var(--terracotta);
  animation:rise .6s .35s cubic-bezier(.2,.7,.2,1) both,glow 4s 1.5s ease-in-out infinite}
.btn.primary:hover{background:rgba(198,107,67,.2);border-color:var(--terracotta)}
.btn.primary .ico{border-color:rgba(198,107,67,.6);color:var(--terracotta)}
.btn.primary .t{color:var(--terracotta)}
footer{text-align:center}
.foot{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px}
.pw{font-size:12px;color:#8e7f72;margin-top:10px;letter-spacing:.02em}
.pw a{font-family:Manrope,sans-serif;font-weight:700;font-size:13.5px;color:var(--caramel);text-decoration:none;letter-spacing:.02em;transition:color .2s,text-shadow .2s}
.pw a:hover{color:var(--cream);text-shadow:0 0 10px rgba(185,130,77,.4)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(198,107,67,0)}50%{box-shadow:0 0 22px rgba(198,107,67,.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg id="mark" width="46" viewBox="0 0 45.6 28" role="img" aria-label="BARCODE logo mark"></svg>
    </div>
    <h1 id="brand"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="loc" id="loc"></p>
  </header>

  <section class="card">
    <div class="intro">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 id="heading"></h2>
      <p id="intro"></p>
    </div>
    <nav class="actions" id="actions" aria-label="Quick actions"></nav>
  </section>

  <footer>
    <p class="foot" id="footline"></p>
    <p class="pw" id="pw"></p>
  </footer>
</div>

<script>
/* ===== CONFIG — the only place to edit ===== */
const CONFIG = {
  brand: "BARCODE",
  tagline: "Good Coffee. Great Food. Better Vibes.",
  location: "Your neighbourhood café & restaurant",
  eyebrow: "Your table. Your experience.",
  heading: "Your next favourite moment starts here.",
  intro: "One tap to discover our menu, share your experience, and stay connected with BARCODE.",
  footerLine: "Great coffee. Good food. Unforgettable company.",
  poweredBy: "Tap'D",
  poweredByUrl: "https://tap-me-puce.vercel.app/",
  // Fill these in before deploying. Buttons with an empty value show but do nothing until set.
  googleReviewUrl: "",   // https://search.google.com/local/writereview?placeid=XXXX
  menuUrl: "",
  websiteUrl: "",
  instagramUrl: "https://www.instagram.com/mehfil_muj/",
  phone: "+91 96676 76677"       // international format, e.g. +919876543210
};

/* ===== Rendering ===== */
const ICONS = {
  star:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  menu:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  insta:'<rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>'
};
const $ = id => document.getElementById(id);
$("brand").textContent = CONFIG.brand;
$("tagline").textContent = CONFIG.tagline;
$("loc").textContent = CONFIG.location;
$("eyebrow").textContent = CONFIG.eyebrow;
$("heading").textContent = CONFIG.heading;
$("intro").textContent = CONFIG.intro;
$("footline").textContent = CONFIG.footerLine;
$("pw").innerHTML = `Powered by <a href="${CONFIG.poweredByUrl}" target="_blank" rel="noopener noreferrer">${CONFIG.poweredBy}</a>`;

// Logo mark: bar widths read as a code; one terracotta accent bar
(function(){
  const bars=[3,1,2,1,4,1,2,3,1,2], gap=1.6; let x=0, out="";
  bars.forEach((w,i)=>{out+=`<rect x="${x}" width="${w}" height="28" rx=".4" fill="${i===4?"#C66B43":"#F2E7D8"}"/>`;x+=w+gap;});
  $("mark").setAttribute("viewBox",`0 0 ${x-gap} 28`); $("mark").innerHTML=out;
})();

const tel = CONFIG.phone ? "tel:" + CONFIG.phone.replace(/[^\d+]/g,"") : "";
const actions = [
  {icon:"menu", title:"Explore Our Menu", sub:"Coffee, comfort food & more.", href:CONFIG.menuUrl, primary:true, ext:true},
  {icon:"star", title:"Leave a Google Review", sub:"Loved your visit? Tell us about it.", href:CONFIG.googleReviewUrl, ext:true},
  {icon:"insta", tone:"#D9658B", title:"Follow on Instagram", sub:"Food, coffee & moments worth sharing.", href:CONFIG.instagramUrl, ext:true},
  {icon:"phone", tone:"#4FB38A", title:"Call BARCODE", sub:CONFIG.phone||"Tap to call us", href:tel}
];
actions.forEach(a=>{
  const el=document.createElement("a");
  el.className="btn"+(a.primary?" primary":"");
  if(a.href){el.href=a.href;}else{el.setAttribute('aria-disabled','true');el.classList.add('off');}
  if(a.ext&&a.href){el.target="_blank";el.rel="noopener noreferrer";}
  el.innerHTML=`<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[a.icon]}</svg></span>
    <span class="txt"><span class="t"></span><span class="s"></span></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;
  if(a.tone)el.querySelector(".ico").style.color=a.tone;
  el.querySelector(".t").textContent=a.title;
  el.querySelector(".s").textContent=a.sub;
  $("actions").appendChild(el);
});
</script>
</body>
</html>
